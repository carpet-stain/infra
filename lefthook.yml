# Hand-maintained, not a copier overlay: this repo is a one-off (ADR-0002).
# Formerly split across lefthook-base.yml/lefthook-lang.yml to mirror
# project-starter-template's composable-overlay structure (ADR-0020 there);
# collapsed since infra never composes a second file in (#21). The `base`/
# `lang` tags below are what lint.yml/tofu.yml's CI jobs each select via
# `just lint --tag ...`; keep every job's tag. Install with `lefthook install`.
pre-commit:
  jobs:
    - name: actionlint
      tags: [base]
      glob:
        - ".github/workflows/*.yml"
        - ".github/workflows/*.yaml"
      run: actionlint {staged_files}

    - name: markdownlint
      tags: [base]
      glob:
        - "*.md"
        - "**/*.md"
      exclude:
        - "CHANGELOG.md"
        - ".claude/agent-memory/**"
      run: markdownlint-cli2 {staged_files}

    - name: md-format
      tags: [base]
      glob:
        - "*.md"
        - "**/*.md"
      exclude:
        - "CHANGELOG.md"
        - ".claude/agent-memory/**"
      run: prettier --check {staged_files}

    - name: yaml-format
      tags: [base]
      glob:
        - ".github/dependabot.yml"
        - ".markdownlint-cli2.yaml"
        - "lefthook.yml"
      run: yamlfmt -lint {staged_files}

    - name: comment-concision
      tags: [base]
      glob:
        - "*.tf"
        - "**/*.tf"
        - "scripts/*.sh"
      run: scripts/check-comment-concision.sh {staged_files}

    - name: workflow-secrets
      tags: [base]
      glob:
        - ".github/workflows/*.yml"
        - ".github/workflows/*.yaml"
      # No stored Secret beyond GITHUB_TOKEN (ADR-0011).
      run: scripts/check-workflow-secrets.sh {staged_files}

    - name: gitleaks
      tags: [base]
      # No glob, no {staged_files}: gitleaks is content-based, not
      # file-type-gated, and must cover .claude/agent-memory/** (the
      # committed agent-memory store's secrets floor) — never copy the
      # markdown jobs' exclude list here. Whole-tree dir scan rather than
      # --staged so the same invocation is meaningful under CI's
      # `lefthook run pre-commit --all-files`, where nothing is staged.
      # Allowlist lives in .gitleaks.toml. Lineage: dotfiles#390, ported via
      # project-starter-template#26 (#101).
      run: gitleaks dir . --no-banner --redact

    - name: shfmt
      tags: [base]
      glob:
        - "scripts/*.sh"
      # Ported via project-starter-template#28 (#101).
      run: shfmt -i 2 -ci -d {staged_files}

    - name: shellcheck
      tags: [base]
      # .envrc/.envrc.local.example carry `# shellcheck shell=bash`
      # directives since they have no shebang of their own. Ported via
      # project-starter-template#28 (#101).
      glob:
        - "scripts/*.sh"
        - ".envrc"
        - ".envrc.local.example"
      run: shellcheck {staged_files}

    - name: justfile-format
      tags: [base]
      glob:
        - "justfile"
      # --justfile (not a positional, which `just` reads as a recipe name)
      # takes exactly one path. --fmt --check validates syntax (it must
      # parse to format) and canonical formatting in one pass. Ported via
      # project-starter-template#29 (#101).
      run: just --fmt --check --justfile {staged_files}

    - name: editorconfig-checker
      tags: [base]
      glob:
        - "*"
        - "**/*"
      exclude:
        - "CHANGELOG.md"
        - ".claude/agent-memory/**"
      # The catch-all for files no dedicated formatter covers. Indent checks
      # are off (--disable-indentation): indentation stays each
      # per-language formatter's job (shfmt/prettier/yamlfmt), which
      # understands its own syntax. Ported via project-starter-template#29
      # (#101).
      run: editorconfig-checker --disable-indentation {staged_files}

    - name: envrc-local-example-sync
      tags: [base]
      run: scripts/check-envrc-local-example.sh

    # The tofu format/lint jobs run explicitly in root and iam/ (never a
    # -recursive walk, which would descend into .claude/worktrees copies).
    # Globs carry "**/*.tf" so an iam/-only change still triggers them.
    - name: tofu-format
      tags: [lang]
      glob:
        - "*.tf"
        - "**/*.tf"
      run: tofu fmt -check && tofu fmt -check iam

    - name: tofu-lint
      tags: [lang]
      glob:
        - "*.tf"
        - "**/*.tf"
      run: tflint && tflint --chdir=iam

    - name: tofu-scan
      tags: [lang]
      glob:
        - "*.tf"
        - "**/*.tf"
      run: trivy config --exit-code 1 --quiet .

pre-push:
  jobs:
    - name: envrc-local-example-sync
      tags: [base]
      run: scripts/check-envrc-local-example.sh
