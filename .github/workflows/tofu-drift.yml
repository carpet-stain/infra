name: Tofu drift

# Layer 2 of #87: tofu-plan.yml only ever plans against a PR's branch, so
# drift that never crosses a PR (a manual console edit, a change made
# outside tofu entirely) never surfaces anywhere. This runs a read-only
# `tofu plan` against `main` on a schedule and keeps a single pinned,
# labeled issue in sync with the result — opened/updated while drift is
# non-empty, closed once a plan comes back clean. No apply capability and
# no saved-plan artifact: this is diagnostic-only, never consumed by
# tofu-apply.yml (ADR-0003's saved-plan model is unchanged).
on:
  schedule:
    # Weekly, 03:00 UTC every Sunday. Tune here only — nothing else
    # derives from this interval.
    - cron: "0 3 * * 0"
  workflow_dispatch: {}

concurrency:
  group: tofu-drift
  cancel-in-progress: true

jobs:
  drift:
    name: tofu drift plan
    runs-on: ubuntu-latest
    # Job-scoped per ADR-0010's step 5. issues: write only for the pinned
    # drift issue below; id-token: write presents this schedule run's
    # branch-ref sub to assume the read-only infra-plan-read role.
    permissions:
      contents: read
      issues: write
      id-token: write
    # Same read-only credential surface as tofu-plan.yml (#87's acceptance
    # criterion) — SSM via OIDC only, no secrets.* reference (#126).
    env:
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Install tenv (pinned)
        env:
          TENV_VERSION: "4.14.8"
        run: |
          curl -fsSL "https://github.com/tofuutils/tenv/releases/download/v${TENV_VERSION}/tenv_v${TENV_VERSION}_Linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin tenv tofu

      # Same OIDC-assumed infra-plan-read role as tofu-plan.yml (ADR-0010)
      # — a schedule run presents the branch-ref sub, the trust policy's
      # second allowed value. AWS_* env carries these creds, which also
      # power the SSM fetch below; R2's move to -backend-config.
      - name: Assume infra-plan-read via OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: us-east-1

      # Same read-only SSM fetch as tofu-plan.yml (#122, ADR-0010) —
      # state-backend credentials and the App private key, nothing apply
      # needs.
      - name: Read secrets from SSM
        id: ssm
        uses: ./.github/actions/read-ssm-params
        with:
          names: >-
            /infra/tf-state-passphrase
            /infra/r2-plan-access-key-id
            /infra/r2-plan-storage-token
            /infra/r2-account-id
            /infra/gh-app-private-key
            /infra/cloudflare-api-token-ro
            /infra/b2-management-key-id
            /infra/b2-management-key

      # Same read-only App token as tofu-plan.yml (#59) — no write scope,
      # this never mutates repo state.
      - name: Mint read-only App token
        id: app-token
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ steps.ssm.outputs.GH_APP_PRIVATE_KEY }}
          repositories: dotfiles,infra,project-starter-template,golden-ratio-dual-gate,deal-finder,template-e2e,agents,agent-memory-server
          permission-administration: read
          permission-issues: read

      # Mirrors tofu-plan.yml's tofu init + plan exactly, minus the
      # artifact/tree-hash bookkeeping — this plan is never consumed by an
      # apply, only read for its "any changes?" verdict.
      - name: tofu init + plan
        id: plan
        env:
          TENV_AUTO_INSTALL: "true"
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          TF_STATE_PASSPHRASE: ${{ steps.ssm.outputs.TF_STATE_PASSPHRASE }}
          R2_PLAN_ACCESS_KEY_ID: ${{ steps.ssm.outputs.R2_PLAN_ACCESS_KEY_ID }}
          R2_PLAN_STORAGE_TOKEN: ${{ steps.ssm.outputs.R2_PLAN_STORAGE_TOKEN }}
          R2_ACCOUNT_ID: ${{ steps.ssm.outputs.R2_ACCOUNT_ID }}
          # The read-only Cloudflare token (#144) — a refresh never writes;
          # the edit token stays confined to apply/dispatch.
          CLOUDFLARE_API_TOKEN: ${{ steps.ssm.outputs.CLOUDFLARE_API_TOKEN_RO }}
          # The b2 provider's native env names — the SSM leaf is
          # b2-management-key*, remapped here (ADR-0017).
          B2_APPLICATION_KEY_ID: ${{ steps.ssm.outputs.B2_MANAGEMENT_KEY_ID }}
          B2_APPLICATION_KEY: ${{ steps.ssm.outputs.B2_MANAGEMENT_KEY }}
        run: |
          r2_secret_key="$(printf '%s' "$R2_PLAN_STORAGE_TOKEN" | shasum -a 256 | cut -d' ' -f1)"
          export AWS_ENDPOINT_URL_S3="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          export TF_ENCRYPTION='
          key_provider "pbkdf2" "state" {
            passphrase = "'"$TF_STATE_PASSPHRASE"'"
          }
          method "aes_gcm" "state" {
            keys = key_provider.pbkdf2.state
          }
          state {
            method   = method.aes_gcm.state
            enforced = true
          }
          plan {
            method   = method.aes_gcm.state
            enforced = true
          }'
          # R2 credentials via the r2-backend profile (#164; why on
          # tofu-plan.yml's init comment). This plan's artifact is never
          # applied, but one shape everywhere beats a special case.
          printf '[r2-backend]\naws_access_key_id = %s\naws_secret_access_key = %s\n' \
            "$R2_PLAN_ACCESS_KEY_ID" "$r2_secret_key" >"$RUNNER_TEMP/r2-credentials"
          export AWS_SHARED_CREDENTIALS_FILE="$RUNNER_TEMP/r2-credentials"
          tofu init -input=false -backend-config="profile=r2-backend"
          # -lock=false: same reasoning as tofu-plan.yml — this R2
          # credential is read-only, can't take the write-based lock, and
          # doesn't need to since this never writes state.
          tofu plan -out=tfplan -input=false -lock=false
          tofu show -no-color tfplan > plan.txt

      - name: Open, update, or close the pinned drift issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          marker="<!-- tofu-drift -->"

          plan_nonempty=false
          grep -q '^Plan: ' plan.txt && plan_nonempty=true

          existing=$(gh issue list --repo "${GITHUB_REPOSITORY}" --label tofu-drift --state open \
            --json number --jq '.[0].number // empty')

          if $plan_nonempty; then
            body_file="$(mktemp)"
            {
              echo "$marker"
              echo
              echo "### Pending changes on \`main\`"
              echo
              echo "A scheduled [\`tofu plan\`](${RUN_URL}) against \`main\` found drift that no PR" \
                   "surfaced. This issue stays open and updates in place until a scheduled plan"  \
                   "comes back empty; to apply now, dispatch \`tofu-apply-dispatch.yml\`."
              echo
              echo '```'
              cat plan.txt
              echo '```'
            } >"$body_file"

            if [[ -n "$existing" ]]; then
              gh issue edit "$existing" --repo "${GITHUB_REPOSITORY}" --body-file "$body_file"
            else
              gh issue create --repo "${GITHUB_REPOSITORY}" --title "Tofu drift detected on main" \
                --label tofu-drift --body-file "$body_file"
            fi
          elif [[ -n "$existing" ]]; then
            gh issue close "$existing" --repo "${GITHUB_REPOSITORY}" \
              --comment "Closing — the latest scheduled [plan](${RUN_URL}) against \`main\` shows no pending changes."
          fi
