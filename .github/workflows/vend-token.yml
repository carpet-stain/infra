name: Vend scoped token

# Publishes a narrowly-scoped, rotating GitHub token to SSM's /runtime/vended-token
# (#124, ADR-0010) so a local/agent shell never touches the App's raw private key.
on:
  schedule:
    # Best-effort, not a hard guarantee — GitHub's schedule: trigger can lag
    # hours under load on public repos regardless of cadence (ADR-0008 §#76/#98).
    - cron: "*/5 * * * *"
  # Manual trigger: the #51 dry run, or an immediate re-vend after the
  # 60-day inactivity auto-disable (ADR-0008) is cleared.
  workflow_dispatch:

# Only the newest vend matters — a queued run superseding an in-flight one
# just publishes a fresher token. Distinct from the tofu-apply group.
concurrency:
  group: vend-token
  cancel-in-progress: true

jobs:
  vend:
    name: mint and publish
    runs-on: ubuntu-latest
    # Zero GITHUB_TOKEN grants — auths entirely via the App key + OIDC
    # infra-vend-write role; id-token: write is the OIDC assertion only (ADR-0010's step 5).
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Assume infra-vend-write via OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_VEND_ROLE_ARN }}
          aws-region: us-east-1

      # Inline, not read-ssm-params: that action's GetParameters (plural) would be
      # denied — this role's grant is GetParameter on the App-key ARN alone (iam/main.tf).
      - name: Read App private key from SSM
        id: ssm-key
        run: |
          value="$(aws ssm get-parameter --name /infra/gh-app-private-key \
            --with-decryption --query Parameter.Value --output text)"
          if [[ "$value" == "PLACEHOLDER" ]]; then
            echo "::error::/infra/gh-app-private-key still holds ssm.tf's placeholder — run docs/BOOTSTRAP.md §10's population step"
            exit 1
          fi
          while IFS= read -r line; do
            [[ -n "$line" ]] && echo "::add-mask::$line"
          done <<<"$value"
          delim="EOF_$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
          { echo "GH_APP_PRIVATE_KEY<<${delim}"; printf '%s\n' "$value"; echo "$delim"; } >>"$GITHUB_OUTPUT"

      # Scoped: {contents, issues, pull_requests, actions, checks, workflows}: write, no
      # administration, repositories excludes infra — full per-permission history in ADR-0008's #163 amendment.
      - name: Mint scoped token
        id: app-token
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ steps.ssm-key.outputs.GH_APP_PRIVATE_KEY }}
          repositories: dotfiles,project-starter-template,template-e2e,agents
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-actions: write
          permission-checks: read
          permission-workflows: write
          # Consumed later by a local shell, not this job — without this the
          # action revokes it on cleanup and every consumer gets a dead token (401).
          skip-token-revoke: "true"

      # No tofu resource on purpose (ssm.tf, ADR-0010) — the first put-parameter
      # creates it. Token rides env + a 0600 tempfile, never argv or `${{ }}` (docs/BOOTSTRAP.md §10).
      - name: Publish token to /runtime/vended-token
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          echo "::add-mask::$APP_TOKEN"
          # create-github-app-token issues a 1-hour token; record the expiry
          # so the consumer (dotfiles#377) can refresh before it lapses.
          expires_at="$(date -u -d '+1 hour' +%Y-%m-%dT%H:%M:%SZ)"
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          jq -cn --arg t "$APP_TOKEN" --arg e "$expires_at" \
            '{Name: "/runtime/vended-token", Type: "SecureString",
              KeyId: "alias/runtime-secrets", Overwrite: true,
              Description: "Rotating vended GitHub App token {token, expires_at} — created by vend-token.yml (#124, ADR-0010)",
              Value: ({token: $t, expires_at: $e} | tostring)}' >"$tmp"
          version="$(aws ssm put-parameter --cli-input-json "file://$tmp" \
            --output text --query Version)"
          echo "Published a fresh token (parameter version ${version}), expires ${expires_at}."
