name: Tofu plan

# The read-only half of ADR-0003's saved-plan-on-merge model: plans every PR
# push, uploads the (already-encrypted, ADR-0002 TF_ENCRYPTION) plan file as
# a tree-hash-keyed artifact for the merge-time apply workflow to consume
# later (#25), and upserts a single PR comment with the rendered plan.
# Keyed by tree hash, not commit SHA (ADR-0007) — GitHub's rebase-merge
# always rewrites the committer info when a PR lands, so the merge SHA
# never equals the SHA this job ran for, even with an up-to-date branch;
# the tree hash is what's actually invariant. Disjoint from tofu.yml's
# fmt/tflint/trivy job — this one touches state, so it needs its own,
# narrower credential surface (see AGENTS.md's Credentials section for
# what these secrets are and how they're provisioned).
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: ["main"]

concurrency:
  group: tofu-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    name: tofu plan
    runs-on: ubuntu-latest
    # Job-scoped, not workflow-scoped, so id-token's audit trail stays per
    # job (ADR-0010's step 5). id-token: write lets this job present its
    # OIDC sub (repo:carpet-stain/infra:pull_request) to assume the
    # read-only infra-plan-read role — no standing AWS credential exists.
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    # Same per-job draft gate as tofu.yml/pr-guards.yml: quiet on WIP drafts,
    # re-triggered for real at ready_for_review.
    if: github.event.pull_request.draft == false
    # No native GitHub token secret reaches this job (#59): the github
    # provider's read credential is an App-minted, read-scoped token (minted
    # below, confined to the plan step), replacing the standing GH_TOKEN PAT;
    # the PR-comment step uses the workflow's own ephemeral github.token
    # (pull-requests: write, above), narrower than the old cross-repo PAT.
    # Everything secret comes from SSM via the OIDC-assumed role (#122,
    # ADR-0010) — no secrets.* reference remains in this job (#126), which
    # also retires #89's Dependabot-store mirroring concern: vars.* don't
    # swap stores on a Dependabot-actored run.
    env:
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      - name: Install tenv (pinned)
        env:
          TENV_VERSION: "4.14.8"
        run: |
          curl -fsSL "https://github.com/tofuutils/tenv/releases/download/v${TENV_VERSION}/tenv_v${TENV_VERSION}_Linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin tenv tofu

      # The aws provider's credential (ADR-0010, #121): OIDC-assumed
      # read-only role, exported into AWS_* env for the provider's env
      # chain — deliberately not Tofu variables, which a saved-plan apply
      # would replay stale (see versions.tf's provider comment). Runs
      # before the SSM fetch below, which reads with these creds. The R2
      # backend cedes the AWS_* names to this; its credentials move to
      # -backend-config flags in the init step below.
      - name: Assume infra-plan-read via OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: us-east-1

      # The state-backend credentials and the App private key, from SSM via
      # the role above (#122, ADR-0010) — replaces the bitwarden/sm-action
      # fetch. Same shape: masked step outputs, never job-wide env.
      - name: Read secrets from SSM
        id: ssm
        uses: ./.github/actions/read-ssm-params
        with:
          names: >-
            /infra/tf-state-passphrase
            /infra/r2-plan-access-key-id
            /infra/r2-plan-storage-token
            /infra/r2-account-id
            /infra/gh-app-private-key
            /infra/cloudflare-api-token-ro
            /infra/b2-management-key-id
            /infra/b2-management-key

      # The github provider's read credential: an App-minted token scoped to
      # read repo/label/ruleset state across the managed repos, replacing the
      # standing GH_TOKEN PAT (#59). administration:read covers repo settings,
      # rulesets, and vulnerability_alerts; issues:read covers labels;
      # metadata is automatic. No write scope — a plan never mutates.
      - name: Derive managed-repo list
        id: repo-list
        uses: ./.github/actions/derive-repo-list

      - name: Mint read-only App token
        id: app-token
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ steps.ssm.outputs.GH_APP_PRIVATE_KEY }}
          repositories: ${{ steps.repo-list.outputs.repositories }}
          permission-administration: read
          permission-issues: read

      # Mirrors .envrc's own derivation (ADR-0002): the R2 S3 secret is
      # sha256(storage token), the endpoint carries the account ID, and
      # TF_ENCRYPTION is built from the shared passphrase via plain bash
      # string concatenation — never GitHub Actions `${{ }}` template
      # interpolation inside a run: script, which would risk the secret
      # breaking out of its quoting if it ever contained shell metacharacters.
      - name: tofu init + plan
        id: plan
        env:
          TENV_AUTO_INSTALL: "true"
          # Raises tenv's GitHub API resolution off the unauthenticated
          # 60 req/hr ceiling (#297) — the default Actions token, not the
          # App-minted one below, which is scoped to the github provider.
          TENV_GITHUB_TOKEN: ${{ github.token }}
          # The github provider's credential — the App-minted read token, not
          # a standing PAT (#59). Confined to this step, not job-wide.
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          TF_STATE_PASSPHRASE: ${{ steps.ssm.outputs.TF_STATE_PASSPHRASE }}
          R2_PLAN_ACCESS_KEY_ID: ${{ steps.ssm.outputs.R2_PLAN_ACCESS_KEY_ID }}
          R2_PLAN_STORAGE_TOKEN: ${{ steps.ssm.outputs.R2_PLAN_STORAGE_TOKEN }}
          R2_ACCOUNT_ID: ${{ steps.ssm.outputs.R2_ACCOUNT_ID }}
          # The read-only Cloudflare token (#144) — a plan only refreshes;
          # the edit token stays confined to apply/dispatch.
          CLOUDFLARE_API_TOKEN: ${{ steps.ssm.outputs.CLOUDFLARE_API_TOKEN_RO }}
          # The b2 provider's native env names — the SSM leaf is
          # b2-management-key*, remapped here (ADR-0017).
          B2_APPLICATION_KEY_ID: ${{ steps.ssm.outputs.B2_MANAGEMENT_KEY_ID }}
          B2_APPLICATION_KEY: ${{ steps.ssm.outputs.B2_MANAGEMENT_KEY }}
        run: |
          r2_secret_key="$(printf '%s' "$R2_PLAN_STORAGE_TOKEN" | shasum -a 256 | cut -d' ' -f1)"
          export AWS_ENDPOINT_URL_S3="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          export TF_ENCRYPTION='
          key_provider "pbkdf2" "state" {
            passphrase = "'"$TF_STATE_PASSPHRASE"'"
          }
          method "aes_gcm" "state" {
            keys = key_provider.pbkdf2.state
          }
          state {
            method   = method.aes_gcm.state
            enforced = true
          }
          plan {
            method   = method.aes_gcm.state
            enforced = true
          }'
          # R2 credentials ride a runner-local AWS profile, not raw
          # -backend-config keys and not AWS_* env (the aws provider owns
          # those names — OIDC step above). Raw keys here get embedded
          # verbatim in the saved plan's backend config, and
          # `tofu apply <planfile>` uses the PLAN's embedded credentials
          # for the state write — so this job's read-only pair 403'd
          # every merge apply until #164 (reproduced locally both ways).
          # A profile name embeds harmlessly: the apply job resolves it
          # against its own runner's file, holding its own tier's pair.
          printf '[r2-backend]\naws_access_key_id = %s\naws_secret_access_key = %s\n' \
            "$R2_PLAN_ACCESS_KEY_ID" "$r2_secret_key" >"$RUNNER_TEMP/r2-credentials"
          export AWS_SHARED_CREDENTIALS_FILE="$RUNNER_TEMP/r2-credentials"
          tofu init -input=false -backend-config="profile=r2-backend"
          # -lock=false: this job's R2 credential is read-only by design
          # (#24's acceptance criterion), so it can't acquire the S3
          # backend's write-based lock at all — and doesn't need to, since a
          # plan never writes state. Same reasoning HCP Terraform's own
          # read-only "speculative plans" use to skip locking entirely.
          tofu plan -out=tfplan -input=false -lock=false
          # Rendered here, not in a later step: TF_ENCRYPTION only exists in
          # this step's own shell process (each workflow step is a separate
          # invocation), and the plan file needs it to decrypt.
          tofu show -no-color tfplan > plan.txt
          # The artifact's real key (ADR-0007) — see the top-of-file
          # comment for why tree hash, not commit SHA.
          echo "tree_sha=$(git rev-parse 'HEAD^{tree}')" >>"$GITHUB_OUTPUT"

      # 7 days, not ADR-0003's original 2: a tighter window meant an
      # ordinary multi-day solo-review cycle alone could outlive the
      # artifact before merge. Outliving it isn't unsafe either way — the
      # apply workflow's escape hatch (#26) covers a missing artifact by
      # design — just friction worth reducing. See AGENTS.md's Branch & PR
      # model for the stale-artifact runbook pointer.
      - uses: actions/upload-artifact@v7
        with:
          name: tfplan-${{ steps.plan.outputs.tree_sha }}
          path: tfplan
          retention-days: 7

      - name: Upsert PR comment with the rendered plan
        env:
          # The workflow's own ephemeral token, not the retired PAT (#59) —
          # pull-requests: write (job permissions) covers commenting on the
          # PR, scoped to this repo only.
          GH_TOKEN: ${{ github.token }}
          TREE_SHA: ${{ steps.plan.outputs.tree_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          marker="<!-- tofu-plan -->"
          body_file="$(mktemp)"

          # #87: a non-empty plan that this PR's merge won't ever apply
          # (tofu-apply.yml's push trigger is path-filtered) stays pending
          # with nothing making that loud. Read tofu-apply.yml's own
          # `on.push.paths` here instead of hardcoding a second copy, so the
          # two lists can't drift apart.
          apply_paths=$(sed -n '/^    paths:/,/^permissions:/p' .github/workflows/tofu-apply.yml \
            | grep '^      - ' | sed -E 's/^\s*-\s*"([^"]+)"\s*$/\1/')

          changed_files=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --paginate \
            --jq '.[].filename')

          touches_apply_paths=false
          while IFS= read -r f; do
            [[ -z "$f" ]] && continue
            while IFS= read -r pat; do
              [[ -z "$pat" ]] && continue
              # shellcheck disable=SC2053  # intentional: $pat is a glob (e.g. "**.tf")
              if [[ "$f" == $pat ]]; then
                touches_apply_paths=true
                break 2
              fi
            done <<<"$apply_paths"
          done <<<"$changed_files"

          plan_nonempty=false
          grep -q '^Plan: ' plan.txt && plan_nonempty=true

          {
            echo "$marker"
            echo
            if $plan_nonempty && ! $touches_apply_paths; then
              echo "> [!WARNING]"
              echo "> This plan has pending changes, but nothing in this PR touches" \
                   "\`tofu-apply.yml\`'s trigger paths (\`**.tf\`, \`.terraform.lock.hcl\`) —" \
                   "**merging this PR will NOT apply them**. Flush via a manual dispatch of" \
                   "[\`tofu-apply-dispatch.yml\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/workflows/tofu-apply-dispatch.yml) if these changes need to land now."
              echo
            fi
            echo "### \`tofu plan\` for \`${GITHUB_SHA}\` (tree \`${TREE_SHA}\`)"
            echo
            echo '```'
            cat plan.txt
            echo '```'
          } >"$body_file"

          comment_id=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n1)

          if [[ -n "$comment_id" ]]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" -F body=@"$body_file"
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -F body=@"$body_file"
          fi
