name: Tofu apply (manual)

# The workflow_dispatch escape hatch ADR-0003's "Failure/retry runbook"
# calls for: a fresh tofu plan + apply pair run directly against main, for
# retrying an apply with no new code change, or recovering when
# tofu-apply.yml hard-fails because no matching plan artifact exists.
on:
  workflow_dispatch:

# Same group name as tofu-apply.yml's merge-triggered apply — a manual
# dispatch queues behind a concurrent merge-apply rather than racing it.
concurrency:
  group: tofu-apply-main
  cancel-in-progress: false

jobs:
  apply:
    name: tofu apply (fresh plan)
    runs-on: ubuntu-latest
    # Job-scoped per ADR-0010's step 5 — a workflow_dispatch run on main
    # presents the same branch-ref sub as a merge apply, so it assumes the
    # same infra-apply role.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Install tenv (pinned)
        env:
          TENV_VERSION: "4.14.8"
        run: |
          curl -fsSL "https://github.com/tofuutils/tenv/releases/download/v${TENV_VERSION}/tenv_v${TENV_VERSION}_Linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin tenv tofu

      # Same OIDC-assumed infra-apply role as tofu-apply.yml (ADR-0010) —
      # AWS_* env carries these creds, which also power the SSM fetch
      # below; R2's move to -backend-config.
      - name: Assume infra-apply via OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: us-east-1

      # The App's private key and the state-backend credentials, from SSM
      # via the role above (#122, ADR-0010) — replaces the
      # bitwarden/sm-action fetch, same as tofu-apply.yml's merge-triggered
      # job.
      - name: Read secrets from SSM
        id: ssm
        uses: ./.github/actions/read-ssm-params
        with:
          names: >-
            /infra/gh-app-private-key
            /infra/tf-state-passphrase
            /infra/r2-apply-access-key-id
            /infra/r2-apply-storage-token
            /infra/r2-account-id
            /infra/cloudflare-api-token
            /infra/b2-management-key-id
            /infra/b2-management-key

      # Administration/Issues match tofu-apply.yml's merge-triggered job. No
      # permission-secrets: this job's fresh `tofu plan` used to refresh a
      # github_actions_secret, but the App key moved to Bitwarden (#47) and
      # no github_actions_secret resource remains in state — its value is
      # read via the SSM fetch above, not managed by the github provider. No
      # permission-variables either — see mint-app-token's own comment for
      # why github_actions_variable isn't tofu-managed.
      - name: Mint elevated App token
        id: app-token
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ steps.ssm.outputs.GH_APP_PRIVATE_KEY }}
          repositories: dotfiles,infra,project-starter-template,golden-ratio-dual-gate,deal-finder,template-e2e,agents,agent-memory-server
          permission-administration: write
          permission-issues: write

      # Same TF_ENCRYPTION/backend setup as tofu-apply.yml's merge-triggered
      # job (mirrors .envrc, plain bash string concatenation, never GitHub
      # Actions `${{ }}` interpolation inside a run: script) — the one
      # difference is plan+apply run back to back here instead of applying
      # a downloaded artifact, since this path exists precisely for when no
      # matching saved plan is available.
      - name: tofu init + plan + apply
        env:
          TENV_AUTO_INSTALL: "true"
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          TF_STATE_PASSPHRASE: ${{ steps.ssm.outputs.TF_STATE_PASSPHRASE }}
          R2_APPLY_ACCESS_KEY_ID: ${{ steps.ssm.outputs.R2_APPLY_ACCESS_KEY_ID }}
          R2_APPLY_STORAGE_TOKEN: ${{ steps.ssm.outputs.R2_APPLY_STORAGE_TOKEN }}
          R2_ACCOUNT_ID: ${{ steps.ssm.outputs.R2_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ steps.ssm.outputs.CLOUDFLARE_API_TOKEN }}
          # The b2 provider's native env names — the SSM leaf is
          # b2-management-key*, remapped here (ADR-0017).
          B2_APPLICATION_KEY_ID: ${{ steps.ssm.outputs.B2_MANAGEMENT_KEY_ID }}
          B2_APPLICATION_KEY: ${{ steps.ssm.outputs.B2_MANAGEMENT_KEY }}
          TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          r2_secret_key="$(printf '%s' "$R2_APPLY_STORAGE_TOKEN" | shasum -a 256 | cut -d' ' -f1)"
          export AWS_ENDPOINT_URL_S3="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          export TF_ENCRYPTION='
          key_provider "pbkdf2" "state" {
            passphrase = "'"$TF_STATE_PASSPHRASE"'"
          }
          method "aes_gcm" "state" {
            keys = key_provider.pbkdf2.state
          }
          state {
            method   = method.aes_gcm.state
            enforced = true
          }
          plan {
            method   = method.aes_gcm.state
            enforced = true
          }'
          # R2 credentials via the r2-backend profile (#164; why on
          # tofu-plan.yml's init comment). This job plans and applies
          # with one pair, so it never hit the embedded-credential trap —
          # same shape everywhere anyway.
          printf '[r2-backend]\naws_access_key_id = %s\naws_secret_access_key = %s\n' \
            "$R2_APPLY_ACCESS_KEY_ID" "$r2_secret_key" >"$RUNNER_TEMP/r2-credentials"
          export AWS_SHARED_CREDENTIALS_FILE="$RUNNER_TEMP/r2-credentials"
          tofu init -input=false -backend-config="profile=r2-backend"
          tofu plan -out=tfplan -input=false
          tofu apply -input=false tfplan
