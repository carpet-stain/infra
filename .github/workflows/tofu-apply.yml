name: Tofu apply

# The apply half of ADR-0003's saved-plan-on-merge model: on every push to
# main, downloads the exact tfplan-<tree-hash> artifact tofu-plan.yml
# produced for this commit's content and applies it verbatim — never a
# fresh plan. Fully automatic: PR review + merge is the checkpoint, not a
# second gate here.
#
# Keyed by tree hash, not commit SHA (ADR-0007): GitHub's rebase-merge
# always rewrites the committer info when a PR lands, so github.sha here
# never equals the SHA tofu-plan.yml actually ran for, even with an
# up-to-date branch — verified empirically, this made the lookup fail on
# every single merge until fixed. The tree hash is what's actually
# invariant, since it only reflects file content.
on:
  push:
    branches: ["main"]
    # Only merges that actually touch tofu files need an apply — otherwise
    # this ran on every docs/CI merge and applied a 0-change no-op, minting
    # an elevated App token for nothing and cluttering the run history.
    # Deliberately NOT mirrored onto tofu-plan.yml: plan must keep running on
    # every PR push so its tfplan artifact always matches the latest tree
    # hash. If plan were filtered too, a PR that touched a .tf and then got a
    # later non-tofu push wouldn't re-plan, and this apply would fail hunting
    # for an artifact keyed to a tree that no plan ever ran for. Need to force
    # an apply for a non-tofu change? The workflow_dispatch escape hatch
    # (tofu-apply-dispatch.yml, #26) runs a fresh plan+apply, no artifact.
    paths:
      - "**.tf"
      - ".terraform.lock.hcl"

# Applies queue, they don't cancel — cancelling a half-applied tofu run
# would leave state in an unknown position. Shared group name with the
# workflow_dispatch escape hatch (#26): a manual dispatch queues behind a
# concurrent merge-apply rather than racing it.
concurrency:
  group: tofu-apply-main
  cancel-in-progress: false

jobs:
  apply:
    name: tofu apply
    runs-on: ubuntu-latest
    # Job-scoped per ADR-0010's step 5. id-token: write presents this run's
    # OIDC sub (repo:carpet-stain/infra:ref:refs/heads/main) to assume the
    # read-write infra-apply role.
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      # Find and download by tree hash, not by "the tofu-plan.yml run for
      # this commit SHA" — that run never existed under this SHA, only
      # under the PR's pre-merge one (see the top-of-file comment). The
      # artifacts-list API returns each artifact's own producing run, so
      # this needs no separate "find the run" step at all: look up the
      # artifact directly by name, take its workflow_run.id, download from
      # that. Read-only, the default ephemeral token already covers it —
      # no need for the elevated App token this early.
      - name: Find and download this tree's plan artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tree_sha=$(git rev-parse 'HEAD^{tree}')
          artifact=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=tfplan-${tree_sha}&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0] // empty')
          if [[ -z "$artifact" ]]; then
            echo "::error::No plan artifact found for tree ${tree_sha} (commit ${GITHUB_SHA}) — retention expired, or the plan job never ran for this content. Not falling back to a fresh plan (ADR-0003) — use the workflow_dispatch escape hatch (#26) instead."
            exit 1
          fi
          run_id=$(echo "$artifact" | jq -r '.workflow_run.id')
          gh run download "$run_id" --name "tfplan-${tree_sha}" --dir .

      - name: Install tenv (pinned)
        env:
          TENV_VERSION: "4.14.8"
        run: |
          curl -fsSL "https://github.com/tofuutils/tenv/releases/download/v${TENV_VERSION}/tenv_v${TENV_VERSION}_Linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin tenv tofu

      # The aws provider's credential (ADR-0010, #121): OIDC-assumed
      # read-write role, exported into AWS_* env for the provider's env
      # chain. The saved plan carries no AWS credential — provider auth
      # re-resolves from this env at apply, which is the whole reason CI
      # creds ride env, never Tofu variables (see versions.tf). Runs before
      # the SSM fetch below, which reads with these creds. The R2 backend
      # cedes the AWS_* names; its creds move to -backend-config.
      - name: Assume infra-apply via OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: us-east-1

      # The App's private key and the state-backend credentials (passphrase,
      # read-write R2 pair, account id), from SSM via the role above (#122,
      # ADR-0010) — replaces the bitwarden/sm-action fetch. Same shape:
      # masked step outputs, not broadcast into job env.
      - name: Read secrets from SSM
        id: ssm
        uses: ./.github/actions/read-ssm-params
        with:
          names: >-
            /infra/gh-app-private-key
            /infra/tf-state-passphrase
            /infra/r2-apply-access-key-id
            /infra/r2-apply-storage-token
            /infra/r2-account-id
            /infra/cloudflare-api-token
            /infra/b2-management-key-id
            /infra/b2-management-key

      # Scoped to exactly what main.tf's resources write: Administration
      # (repo settings, rulesets) and Issues (labels) — nothing else, and
      # only for the repos this apply actually touches.
      - name: Derive managed-repo list
        id: repo-list
        uses: ./.github/actions/derive-repo-list

      - name: Mint elevated App token
        id: app-token
        uses: ./.github/actions/mint-app-token
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ steps.ssm.outputs.GH_APP_PRIVATE_KEY }}
          repositories: ${{ steps.repo-list.outputs.repositories }}
          permission-administration: write
          permission-issues: write

      # Mirrors .envrc's own derivation (ADR-0002), same pattern
      # tofu-plan.yml uses — plain bash string concatenation, never GitHub
      # Actions `${{ }}` template interpolation inside a run: script. The
      # R2 credential here is Read & Write (unlike tofu-plan.yml's
      # deliberately read-only one) since apply has to write state.
      - name: tofu init + apply
        env:
          TENV_AUTO_INSTALL: "true"
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          TF_STATE_PASSPHRASE: ${{ steps.ssm.outputs.TF_STATE_PASSPHRASE }}
          R2_APPLY_ACCESS_KEY_ID: ${{ steps.ssm.outputs.R2_APPLY_ACCESS_KEY_ID }}
          R2_APPLY_STORAGE_TOKEN: ${{ steps.ssm.outputs.R2_APPLY_STORAGE_TOKEN }}
          R2_ACCOUNT_ID: ${{ steps.ssm.outputs.R2_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ steps.ssm.outputs.CLOUDFLARE_API_TOKEN }}
          # The b2 provider's native env names — the SSM leaf is
          # b2-management-key*, remapped here (ADR-0017).
          B2_APPLICATION_KEY_ID: ${{ steps.ssm.outputs.B2_MANAGEMENT_KEY_ID }}
          B2_APPLICATION_KEY: ${{ steps.ssm.outputs.B2_MANAGEMENT_KEY }}
          TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          r2_secret_key="$(printf '%s' "$R2_APPLY_STORAGE_TOKEN" | shasum -a 256 | cut -d' ' -f1)"
          export AWS_ENDPOINT_URL_S3="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          export TF_ENCRYPTION='
          key_provider "pbkdf2" "state" {
            passphrase = "'"$TF_STATE_PASSPHRASE"'"
          }
          method "aes_gcm" "state" {
            keys = key_provider.pbkdf2.state
          }
          state {
            method   = method.aes_gcm.state
            enforced = true
          }
          plan {
            method   = method.aes_gcm.state
            enforced = true
          }'
          # R2 credentials via the r2-backend profile, not raw
          # -backend-config keys (#164) — the saved plan embeds the plan
          # job's backend config, and apply uses the plan's embedded
          # credentials, so only a runtime-resolved profile name puts
          # THIS job's read-write pair on the state write. Why lives on
          # tofu-plan.yml's init comment.
          printf '[r2-backend]\naws_access_key_id = %s\naws_secret_access_key = %s\n' \
            "$R2_APPLY_ACCESS_KEY_ID" "$r2_secret_key" >"$RUNNER_TEMP/r2-credentials"
          export AWS_SHARED_CREDENTIALS_FILE="$RUNNER_TEMP/r2-credentials"
          tofu init -input=false -backend-config="profile=r2-backend"
          # Applies the exact downloaded plan, not a fresh one — the whole
          # point of the saved-plan-on-merge model (ADR-0003). Normal
          # locking (no -lock=false, unlike the plan job): this writes
          # state, and the R2 backend's use_lockfile locking is the safety
          # net against a concurrent manual `just tofu-apply`.
          tofu apply -input=false tfplan
