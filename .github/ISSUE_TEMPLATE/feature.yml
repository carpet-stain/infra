name: Feature / enhancement
description: Propose a new feature or an improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: The problem or need — lead with the point, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you'd build or change, and the alternatives you weighed. No file paths or code — they stale fast; a snippet that itself encodes a decision is the exception.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
      description: How we'll know it's done.
    validations:
      required: false
  - type: textarea
    id: non-goals
    attributes:
      label: Non-goals
      description: What this deliberately won't do.
    validations:
      required: false
